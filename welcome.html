<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c9a9a2">
  <title>A Little Book of Dominion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Playfair Display', Georgia, serif;
      background: #c9aaa1;
    }

    .welcome {
      position: relative;
      min-height: 100svh;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 22px;
      isolation: isolate;
      background: #c9aaa1;
      color: #fff8f2;
      text-align: center;
    }

    /* Your original photo fills the whole screen */
    .welcome::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("dominion_portrait_rotated.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transform: scale(1.02);
    }

    /* Soft beige and dusty-rose blend, not bright pink */
    .welcome::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(
          180deg,
          rgba(177, 139, 130, 0.48) 0%,
          rgba(111, 78, 73, 0.38) 42%,
          rgba(193, 158, 148, 0.44) 100%
        ),
        linear-gradient(
          90deg,
          rgba(224, 199, 186, 0.20),
          transparent 55%,
          rgba(218, 187, 178, 0.20)
        );
    }

    .content {
      width: 100%;
      max-width: 520px;
      padding: 28px 10px;
      animation: appear 1.4s ease both;
      text-shadow: 0 2px 18px rgba(53, 35, 33, 0.32);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      line-height: 1.8;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .ornament {
      color: #f6dcd5;
      font-size: 28px;
      margin-bottom: 24px;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(40px, 9vw, 65px);
      line-height: 1.13;
      margin-bottom: 18px;
    }

    h1 span {
      display: block;
      font-family: 'Great Vibes', cursive;
      font-size: clamp(49px, 12vw, 78px);
      color: #f8dcd7;
      margin-top: 2px;
    }

    .message {
      max-width: 390px;
      margin: 0 auto 34px;
      font-size: 16px;
      line-height: 1.9;
      color: #fff7f1;
    }

    .enter-button {
      display: inline-block;
      padding: 15px 32px;
      border: 1px solid rgba(255, 239, 231, 0.85);
      border-radius: 50px;
      background: rgba(133, 81, 82, 0.74);
      color: #fffaf6;
      font-family: inherit;
      font-size: 16px;
      text-decoration: none;
      text-shadow: none;
      box-shadow: 0 8px 25px rgba(61, 39, 37, 0.12);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .enter-button:hover {
      background: rgba(108, 66, 68, 0.92);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 32px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #fff1e9;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-height: 650px) {
      .content {
        padding: 12px 8px;
      }

      .eyebrow {
        margin-bottom: 12px;
      }

      .ornament {
        margin-bottom: 12px;
      }

      h1 {
        font-size: clamp(34px, 8vw, 52px);
      }

      h1 span {
        font-size: clamp(42px, 10vw, 62px);
      }

      .message {
        margin-bottom: 20px;
      }

      .footer {
        margin-top: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content {
        animation: none;
      }

      .enter-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="welcome">
    <div class="content">
      <p class="eyebrow">A little corner of my world</p>

      <div class="ornament">♡ &nbsp; ✧ &nbsp; ♡</div>

      <h1>
        Welcome to my
        <span>little world.</span>
      </h1>

      <p class="message">
        A collection of moments, memories, and people
        who make life beautiful.
      </p>

      <a class="enter-button" href="index.html">
        Enter my world ♡
      </a>

      <p class="footer">MADE WITH LOVE · DOMINION</p>
    </div>
  </main>
</body>
</html>
