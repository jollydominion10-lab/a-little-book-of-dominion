
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion's Admin Studio</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #fbf5ef;
      color: #57443f;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 480px;
      margin: 30px auto;
    }
    .card {
      background: #fffaf6;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #eadbd3;
      margin-bottom: 18px;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
    }
    p { line-height: 1.6; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #d9c6bd;
      background: white;
    }
    button {
      border: 0;
      background: #b87589;
      color: white;
      cursor: pointer;
    }
    .note { font-size: 13px; color: #806e66; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p>♡ A LITTLE BOOK OF DOMINION</p>
      <h1>Admin Studio</h1>
      <p>Your private corner for caring for the memories, stories and wishes.</p>
    </div>

    <div class="card">
      <h2>Sign in</h2>
      <p>Sign in with the admin account you created in Supabase.</p>
      <input id="email" type="email" placeholder="Admin email">
      <input id="password" type="password" placeholder="Password">
      <button id="signIn">Sign in</button>
      <p id="message" role="status"></p>
      <p class="note">Sign in to manage your website.</p>
    </div>

    <div class="card">
      <h2>Your content</h2>
      <p>Photo uploads, caption editing and approval controls will be added next.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("message").textContent =
      "Supabase client loaded. Ready to test sign-in.";

    document.getElementById("signIn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Please enter your admin email and password.";
        return;
      }

      message.textContent = "Signing in...";

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Sign-in failed: " + error.message;
        return;
      }

      message.textContent = "Sign-in successful! Your connection is working.";
    });
  </script>
</body>
</html>
