
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion's Admin Studio</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #fbf5ef;
      color: #57443f;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 480px;
      margin: 30px auto;
    }
    .card {
      background: #fffaf6;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #eadbd3;
      margin-bottom: 18px;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
    }
    p { line-height: 1.6; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #d9c6bd;
      background: white;
    }
    button {
      border: 0;
      background: #b87589;
      color: white;
      cursor: pointer;
    }
    .note { font-size: 13px; color: #806e66; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p>♡ A LITTLE BOOK OF DOMINION</p>
      <h1>Admin Studio</h1>
      <p>Your private corner for caring for the memories, stories and wishes.</p>
    </div>

    <div class="card">
      <h2>Sign in</h2>
      <p>Sign in with the admin account you created in Supabase.</p>
      <input id="email" type="email" placeholder="Admin email">
      <input id="password" type="password" placeholder="Password">
      <button id="signIn">Sign in</button>
      <p id="message" role="status"></p>
      <p class="note">Sign in to manage your website.</p>
    </div>

   
<div class="card" id="photoManager" hidden>
  <h2>Your memories</h2>
  <p>Upload a photo and give it a caption.</p>

  <form id="photoForm">
    <label for="photo">Choose a photo</label>
    <input id="photo" type="file" accept="image/*" required>

    <label for="caption">Photo caption</label>
    <input
      id="caption"
      type="text"
      placeholder="Write a little caption..."
      maxlength="200"
      required
    >

    <button type="submit">Upload memory ♡</button>
  </form>

  <p id="uploadMessage" role="status"></p>
  <div id="photoList"></div>

  <button id="signOut" type="button">Sign out</button>
</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("message").textContent =
      "Supabase client loaded. Ready to test sign-in.";

    document.getElementById("signIn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Please enter your admin email and password.";
        return;
      }

      message.textContent = "Signing in...";

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Sign-in failed: " + error.message;
        return;
      }

      message.textContent = "Sign-in successful! Your connection is working.";
    
const photoManager = document.getElementById("photoManager");
const photoForm = document.getElementById("photoForm");
const uploadMessage = document.getElementById("uploadMessage");
const photoList = document.getElementById("photoList");

// Show the photo manager only after admin sign-in.
async function checkAdminSession() {
  const { data: { session } } = await client.auth.getSession();

  if (session) {
    photoManager.hidden = false;
    await loadMemories();
  }
}

async function loadMemories() {
  photoList.replaceChildren();

  const { data, error } = await client
    .from("site_content")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    uploadMessage.textContent = "Could not load memories: " + error.message;
    return;
  }

  for (const memory of data) {
    const item = document.createElement("div");
    item.style.marginTop = "16px";

    const caption = document.createElement("p");
    caption.textContent = memory.caption || "Untitled memory";

    item.appendChild(caption);

    if (memory.image_path) {
      const { data: imageData } = client.storage
        .from("site-images")
        .getPublicUrl(memory.image_path);

      const image = document.createElement("img");
      image.src = imageData.publicUrl;
      image.alt = memory.caption || "Memory photo";
      image.style.width = "100%";
      image.style.maxWidth = "320px";
      image.style.borderRadius = "12px";

      item.prepend(image);
    }

    photoList.appendChild(item);
  }
}

photoForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const { data: { session } } = await client.auth.getSession();

  if (!session) {
    uploadMessage.textContent = "Please sign in first.";
    photoManager.hidden = true;
    return;
  }

  const file = document.getElementById("photo").files[0];
  const caption = document.getElementById("caption").value.trim();

  if (!file || !caption) {
    uploadMessage.textContent = "Choose a photo and enter a caption.";
    return;
  }

  if (!file.type.startsWith("image/")) {
    uploadMessage.textContent = "Please choose an image file.";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    uploadMessage.textContent = "Please choose an image smaller than 5 MB.";
    return;
  }

  uploadMessage.textContent = "Uploading your memory...";

  const filePath = `${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;

  const { error: storageError } = await client.storage
    .from("site-images")
    .upload(filePath, file, { contentType: file.type });

  if (storageError) {
    uploadMessage.textContent = "Photo upload failed: " + storageError.message;
    return;
  }

  const { error: databaseError } = await client
    .from("site_content")
    .insert({
      content_key: "memory",
      image_path: filePath,
      caption
    });

  if (databaseError) {
    uploadMessage.textContent =
      "The photo uploaded, but saving its caption failed: " +
      databaseError.message;
    return;
  }

  photoForm.reset();
  uploadMessage.textContent = "Memory saved successfully! ♡";
  await loadMemories();
});

document.getElementById("signOut").addEventListener("click", async () => {
  await client.auth.signOut();
  photoManager.hidden = true;
  uploadMessage.textContent = "You have signed out.";
});
  checkAdminSession();
</script>
</body>
</html>
